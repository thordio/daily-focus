name: Daily Focus Morning
on:
  schedule:
    - cron: "0 0 * * *"  # UTC 00:00 = Beijing 08:00
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup config
        run: cp data/config-morning.json data/config.json
      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours 14 --period morning
      - name: Render & Deploy
        run: uv run python scripts/render_and_deploy.py --period morning
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
