name: Daily Focus
on:
  schedule:
    - cron: "43 5 * * *"  # UTC 05:43 = Beijing 13:43
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch archive from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show gh-pages:docs/daily/ >/dev/null 2>&1; then
            git checkout gh-pages -- docs/daily/
            echo "Restored previous daily editions"
          else
            echo "No previous archive (first run)"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: uv run horizon --hours 24

      - name: Render & Deploy
        run: uv run python scripts/render_and_deploy.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          enable_jekyll: false
